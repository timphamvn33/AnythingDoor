services:
  - type: web
    name: anythingdoor-api
    runtime: node
    plan: free
    buildCommand: cd db && npm ci && npx prisma generate && cd ../backend && npm ci --include=dev && npm run build
    startCommand: cd db && npx prisma migrate deploy && cd ../backend && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: http://localhost:5173
