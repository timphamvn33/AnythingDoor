services:
  - type: web
    name: anythingdoor-api
    runtime: node
    plan: free
    buildCommand: cd db && npm ci && npx prisma generate && cd ../backend && npm ci --include=dev && npm run build
    startCommand: cd db && npx prisma migrate deploy && cd ../backend && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://anything-door.vercel.app,https://anything-door-*.vercel.app,http://localhost:5173
      - key: FRONTEND_URL
        value: https://anything-door.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
